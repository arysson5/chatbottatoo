# Deploy com verificação automática:
#   docker compose up -d --wait
#   docker compose --profile verify run --rm verify
#
# Ou em um comando (Linux/macOS/Git Bash):
#   docker compose up -d --wait && docker compose --profile verify run --rm verify

services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  evolution-api:
    container_name: evolution_api
    # v2.1.1 (atendai) tem bug: QR retorna {"count":0} — corrigido em v2.3.7+
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:8080',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  omniroute:
    container_name: briza_omniroute
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      OMNIROUTE_MEMORY_MB: "1024"
    volumes:
      - omniroute_data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:20128/v1/models',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    container_name: briza_web
    image: node:22-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
    environment:
      EVOLUTION_BASE_URL: http://evolution-api:8080
      WEBHOOK_PUBLIC_URL: http://web:3000
      EVOLUTION_GLOBAL_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_URL: postgresql://evolution:${POSTGRES_PASSWORD:-evolution}@postgres:5432/briza_app
      AI_BASE_URL: http://omniroute:20128/v1
      AI_MODEL: auto
      AI_API_KEY: ${AI_API_KEY:-}
    # db:seed só importa se Postgres estiver vazio e app-db.json tiver config (nunca apaga dados existentes)
    command: sh -c "npm install --silent 2>/dev/null && npm run db:provision && npm run db:migrate && npm run db:seed && npm run dev -- --hostname 0.0.0.0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  # Verificação pós-deploy (não sobe com `docker compose up` — use --profile verify)
  verify:
    profiles: ["verify"]
    container_name: briza_verify
    image: node:22-bookworm-slim
    working_dir: /app
    restart: "no"
    depends_on:
      web:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./web:/app
    environment:
      WEBHOOK_URL: http://web:3000/api/webhook
      EVOLUTION_BASE_URL: http://evolution-api:8080
      EVOLUTION_GLOBAL_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_URL: postgresql://evolution:${POSTGRES_PASSWORD:-evolution}@postgres:5432/briza_app
    command: >
      sh -c "
        echo '=== Verificação automática pós-deploy ===' &&
        npm install --silent 2>/dev/null &&
        echo '--- Testes unitários (Jest) ---' &&
        npm run test:unit &&
        echo '--- Fluxo webhook (integração) ---' &&
        npm run test:flow &&
        echo '--- Checagem Evolution API ---' &&
        node -e \"
          const k=process.env.EVOLUTION_GLOBAL_API_KEY||'';
          fetch(process.env.EVOLUTION_BASE_URL+'/',{headers:k?{apikey:k}:{}})
            .then(r=>{if(!r.ok&&r.status!==404)throw new Error('Evolution HTTP '+r.status);console.log('Evolution API respondeu:',r.status);})
            .catch(e=>{console.error(e.message);process.exit(1);})
        \" &&
        echo '=== Deploy verificado com sucesso ==='
      "

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
  omniroute_data:
